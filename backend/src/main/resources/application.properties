# =====================================================================
# AI Interior Design Factory - all configuration lives in this file.
# Values in ${ENV_VAR:default} form can be overridden by environment
# variables without editing the file. Nothing is persisted: design
# sessions are kept in memory; only export files are written to disk.
# =====================================================================
spring.application.name=ai-interior-design-factory
server.port=8080
# Bound to localhost by default: room details and plans stay on this machine.
server.address=127.0.0.1

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------
# AI provider: "mock" (deterministic, offline, default) or "huggingface"
# ---------------------------------------------------------------------
factory.ai.provider=${AI_PROVIDER:mock}
factory.ai.request-timeout=60s
factory.ai.max-attempts=3
factory.ai.initial-backoff=1s

# Hugging Face OpenAI-compatible router (used only when factory.ai.provider=huggingface).
# The token is read from the HF_TOKEN environment variable; never put it in this file.
factory.huggingface.token=${HF_TOKEN:}
factory.huggingface.base-url=${HF_BASE_URL:https://router.huggingface.co}
factory.huggingface.completions-path=/v1/chat/completions
# Must be a chat model your router/provider actually serves, e.g. "meta-llama/Llama-3.1-8B-Instruct".
factory.huggingface.chat-model=${HF_CHAT_MODEL:}
# Ask for response_format=json_object. Set false for providers that reject it.
factory.huggingface.json-mode=true
factory.huggingface.temperature=0.2
factory.huggingface.max-tokens=1200

# ---------------------------------------------------------------------
# Agents and workflow
# ---------------------------------------------------------------------
# Pause between agent messages so the UI can show the conversation as it happens.
factory.agents.step-delay=${AGENT_STEP_DELAY:700ms}
# How long an agent waits for a reply from another agent.
factory.agents.peer-request-timeout=60s
# Bounded retries for failed agent tasks.
factory.agents.max-task-attempts=2
# Number of sessions kept in memory (oldest finished sessions are dropped first).
factory.agents.max-sessions=20
# Human control: the Supervisor waits for your approval before exporting.
factory.agents.require-approval-before-export=true
factory.agents.max-revisions=5

# ---------------------------------------------------------------------
# Export (the only files this application writes)
# ---------------------------------------------------------------------
factory.export.output-dir=${EXPORT_DIR:./exports}

# ---------------------------------------------------------------------
# SketchUp exporter agent
# A native .skp file can only be produced by SketchUp itself (Ruby API).
# Set the SketchUp executable to let the exporter launch SketchUp, build
# the model and save model.skp. Examples:
#   Windows: C:/Program Files/SketchUp/SketchUp 2024/SketchUp.exe
#   macOS:   /Applications/SketchUp 2024/SketchUp.app/Contents/MacOS/SketchUp
# Leave empty to get the geometry + Ruby build script only (run it from
# SketchUp's Ruby Console, then press "Verify .skp" in the UI).
# ---------------------------------------------------------------------
factory.sketchup.executable=${SKETCHUP_EXECUTABLE:}
factory.sketchup.startup-flag=-RubyStartup
factory.sketchup.timeout=5m
factory.sketchup.quit-when-done=true

factory.cors-allowed-origins=http://localhost:5173,http://127.0.0.1:5173
